<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wichteln - Secret Santa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Wichteln</h1>
    <div id="nav"></div>
  </header>

  <main>
    <section id="auth">
      <div id="loginBox">
        <h2>Anmelden</h2>
        <form id="loginForm">
          <label>Benutzername<input name="username" required></label>
          <label>Passwort<input type="password" name="password" required></label>
          <div class="row"><button type="submit">Anmelden</button> <button type="button" id="showRegister">Registrieren</button></div>
        </form>
      </div>

      <div id="registerBox" class="hidden">
        <h2>Registrieren</h2>
        <form id="registerForm">
          <label>Benutzername<input name="username" required></label>
          <label>Passwort<input type="password" name="password" required></label>
          <label><input type="checkbox" name="isAdmin" id="isAdminCheckbox"> Als Admin registrieren (nur für Organisator)</label>
          <label id="adminKeyLabel" class="hidden">Organisator-Passwort<input type="password" name="adminKey" id="adminKeyInput"></label>
          <div class="row"><button type="submit">Registrieren</button> <button type="button" id="showLogin">Zurück</button></div>
        </form>
      </div>

    </section>

    <section id="dashboard" class="hidden">
      <h2 id="welcome"></h2>

      <div id="assignedArea">
        <h3 id="assignedHeader">Person, die du beschenkst</h3>
        <div id="assignedInfo">Noch keine Zuordnung vorhanden.</div>
      </div>

      <div id="userArea">
        <h3>Deine Wunschliste</h3>
        <form id="wishlistForm">
          <textarea id="wishlistInput" placeholder="Eine Wunschliste, ein Item pro Zeile"></textarea>
          <div class="row"><button type="submit">Speichern</button></div>
        </form>
      </div>


      <div class="row"><button id="logoutBtn">Abmelden</button></div>

      <div id="adminArea" class="hidden">
        <h3>Admin-Panel</h3>
        <p>Adminansicht: kodierte Pairs (nur lesend). Dein Admin-Toolkit ist in der Firebase-Konsole.</p>
        <h4>Aktuelle (kodierte) Pairs</h4>
        <pre id="pairsView">(noch keine Wünsche geäußert)</pre>
        <div class="row" style="margin-top:8px">
          <button id="drawBtn">Ziehung durchführen</button>
          <button id="exportPairs">Exportieren</button>
          <button id="resetPairs">Pairs zurücksetzen</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <small></small>
  </footer>

  <!-- Optional: Wenn du Firebase Firestore für geteilte/synchronisierte Daten nutzen willst,
    erstelle eine Datei `firebase-config.js` basierend auf `firebase-config.js.example`.
    Dann wird die App automatisch Firestore verwenden. -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
